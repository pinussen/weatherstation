substitutions:
  name: weatherstation
  friendly_name: Weather Station

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.2

esp32:
  variant: ${esp32_variant}
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret weatherstation_api_key
  # Keep collecting weather while Home Assistant is offline.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret weatherstation_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret weatherstation_ap_password

captive_portal:

preferences:
  flash_write_interval: 5min

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  scan: true
  frequency: 100kHz

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
  - platform: safe_mode
    name: Restart in safe mode
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status

sensor:
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ESPHome version
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: IP address
      entity_category: diagnostic
