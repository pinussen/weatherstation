as5600:
  id: wind_vane

number:
  - platform: template
    id: north_offset
    name: Wind direction offset
    entity_category: config
    unit_of_measurement: '°'
    min_value: 0
    max_value: 359.9
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true

button:
  - platform: template
    name: Calibrate north
    entity_category: config
    on_press:
      - lambda: |-
          if (std::isfinite(id(vane_position).state)) {
            auto call = id(north_offset).make_call();
            call.set_value(id(vane_position).state);
            call.perform();
          }

sensor:
  - platform: as5600
    id: vane_position
    internal: true
    update_interval: 2s
    # Sensor values are 12-bit positions, NOT degrees.
    filters:
      - multiply: 0.087890625
      - timeout: 10s
  - platform: template
    name: Wind direction
    unit_of_measurement: '°'
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 2s
    lambda: |-
      const float raw = id(vane_position).state;
      if (!std::isfinite(raw)) return NAN;
      // Circular mean: 359 and 1 degrees must average to north, not south.
      static float angles[5] = {};
      static unsigned index = 0, count = 0;
      angles[index] = raw * 3.14159265f / 180.0f;
      index = (index + 1) % 5;
      if (count < 5) count++;
      float s = 0, c = 0;
      for (unsigned i = 0; i < count; i++) {
        s += sinf(angles[i]);
        c += cosf(angles[i]);
      }
      if (fabsf(s) + fabsf(c) < 0.00001f) return NAN;
      return fmodf(atan2f(s, c) * 180.0f / 3.14159265f - id(north_offset).state + 720.0f, 360.0f);
