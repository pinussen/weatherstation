name: ESPHome ESP32 builds

on:
  push:
    paths: ['weatherstation.yaml', 'esphome/**', 'requirements-dev.txt', '.github/workflows/esphome.yml']
  pull_request:
    paths: ['weatherstation.yaml', 'esphome/**', 'requirements-dev.txt', '.github/workflows/esphome.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [weatherstation.yaml, esphome/weatherstation-esp32.yaml, esphome/weatherstation-c3.yaml, esphome/weatherstation-s3.yaml, esphome/weatherstation-s2.yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate
        run: esphome config ${{ matrix.config }}
      - name: Compile
        run: esphome compile ${{ matrix.config }}
